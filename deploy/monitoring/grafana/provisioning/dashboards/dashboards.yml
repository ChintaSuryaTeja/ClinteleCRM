# Loads every dashboard JSON file in /var/lib/grafana/dashboards
# (deploy/monitoring/grafana/dashboards in the repo).
apiVersion: 1

providers:
  - name: Clientele
    folder: Clientele
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
