# Prometheus asks each of these for its numbers every 15 seconds and keeps
# them for 15 days. All of them are only reachable inside the Docker network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api # requests, errors, response times (GET /metrics)
    static_configs:
      - targets: ["api:8000"]

  - job_name: server # CPU, memory, disk of the machine
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: database
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis # including the job queue length
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
