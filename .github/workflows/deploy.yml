# Deploy on merge to main - SWITCHED OFF until you're ready to host.
#
# How deploying works (a "pull" setup, so GitHub never needs a password or
# SSH key for the server):
#   1. A commit lands on main and the CI workflow passes.
#   2. This workflow builds the production images for the server's ARM CPU and
#      publishes them to GitHub's container registry (free for public repos),
#      tagged "main" and with the commit's SHA.
#   3. On the server, a timer (set up by infra/cloud-init.yaml) checks every
#      5 minutes, pulls new images and restarts what changed. The "migrate"
#      service applies database migrations before the API starts.
#
# To switch it on: GitHub repo -> Settings -> Secrets and variables -> Actions
# -> Variables -> New variable: DEPLOY_ENABLED = true
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  publish-images:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    # Native ARM machine (free for public repos), matching the Oracle ARM server.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write # publish to ghcr.io
    env:
      REGISTRY: ghcr.io/chintasuryateja/clintelecrm
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # A short-lived token GitHub creates for this run; nothing to store.
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: api
          target: prod
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/api:main,${{ env.REGISTRY }}/api:${{ env.SHA }}
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: web
          target: prod
          platforms: linux/arm64
          build-args: API_URL=http://api:8000
          push: true
          tags: ${{ env.REGISTRY }}/web:main,${{ env.REGISTRY }}/web:${{ env.SHA }}
