# Local development: all the pieces of the app. (Production: deploy/docker-compose.prod.yml)
# Start everything with:  docker compose up --build
# Values like ${POSTGRES_USER} come from the .env file next to this one.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  api:
    build:
      context: ./api
      target: dev
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      COOKIE_SECURE: ${COOKIE_SECURE}
      # Optional: the Ask screen. ASK_PROVIDER is anthropic or google, and
      # needs that provider's key; without it the screen says it isn't set up.
      ASK_PROVIDER: ${ASK_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      UPLOAD_DIR: /data/uploads
      # Windows folders mounted into Docker don't send file-change events, so poll.
      WATCHFILES_FORCE_POLLING: "true"
    # Apply any new migrations, then start the API and restart it on code changes.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./api:/app
      # Uploaded files wait here for the worker, so both containers mount it.
      - appdata:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./api
      target: dev
    environment: *api-env
    # watchfiles restarts the worker when Python code changes (Celery can't reload itself).
    command: watchfiles --filter python "celery -A app.worker worker --loglevel=info" app
    volumes:
      - ./api:/app
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./api
      target: dev
    environment: *api-env
    # The scheduler: puts the nightly recalculation on the queue at 02:00 UTC.
    # Its bookkeeping file lives in the data volume, not in the project folder.
    command: celery -A app.worker beat --loglevel=info --schedule /data/celerybeat-schedule
    volumes:
      - ./api:/app
      - appdata:/data
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: dev
    # Webpack instead of Turbopack for the dev server: on Windows, Docker gets no
    # file-change events, and webpack's polling watcher (WATCHPACK_POLLING) is
    # the one that reliably notices saved edits. Production builds are unaffected.
    command: npm run dev -- --webpack
    environment:
      # Next.js forwards /api/* to this address (see web/next.config.ts).
      API_URL: http://api:8000
      # Windows folders mounted into Docker don't send file-change events, so poll.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./web:/app
      # node_modules and .next live inside Docker, not in your project folder.
      # That keeps tens of thousands of files out of OneDrive.
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  appdata:
  web_node_modules:
  web_next:
